<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64">
  <!-- secret-garden favicon: warm ivory tile, terracotta disc, sage sprout -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#fbf6ec"/>
      <stop offset="1" stop-color="#f3ead6"/>
    </linearGradient>
    <linearGradient id="disc" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#b96a37"/>
      <stop offset="1" stop-color="#a3542a"/>
    </linearGradient>
    <linearGradient id="leaf" x1="0" y1="1" x2="1" y2="0">
      <stop offset="0" stop-color="#5e7b4e"/>
      <stop offset="1" stop-color="#7d9c67"/>
    </linearGradient>
  </defs>

  <!-- tile -->
  <rect x="2" y="2" width="60" height="60" rx="15" fill="url(#tile)"/>
  <rect x="2" y="2" width="60" height="60" rx="15" fill="none" stroke="#e2d3b8" stroke-width="1.5"/>

  <!-- terracotta disc -->
  <circle cx="32" cy="31" r="21" fill="url(#disc)"/>
  <circle cx="32" cy="31" r="21" fill="none" stroke="#8a4521" stroke-width="0" opacity="0"/>

  <!-- sage sprout: two leaves curling from a stem -->
  <g stroke-linecap="round">
    <!-- stem -->
    <path d="M32 44 C 31 38, 31 30, 33 24" fill="none" stroke="#5e7b4e" stroke-width="2.6"/>
    <!-- left leaf (drawn as petal) -->
    <path d="M32.5 34 C 26 33.5, 22.5 29.5, 23.5 25 C 27.5 24.5, 31.5 27.5, 32.5 34 Z" fill="url(#leaf)"/>
    <!-- right leaf -->
    <path d="M33 29.5 C 38.5 28.5, 42.5 24.5, 41.5 20 C 37 20.5, 33 24.5, 33 29.5 Z" fill="url(#leaf)"/>
  </g>

  <!-- tiny evening star hint (15点以后 / after-hours moon) -->
  <circle cx="43" cy="19.5" r="2.1" fill="#fbf6ec" opacity="0.92"/>
</svg>
